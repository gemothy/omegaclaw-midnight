# Plugins

# Workflow
# Path to the directory which contains available workflows. Default value is
# <project_root>/plugins/workflow/instructions. See plugins/workflow/README.md
# for details.
#pluginWorkflowInstructionsDir: ./plugins/workflow/instructions
# Path to the directory to keep workflow working files when workflow is active.
# Default value is <memoryDirectory>/workflow_space
#pluginWorkflowMemoryDir: ./memory/workflow_space

# Midnight City
# The API token is never configured here. Pass it to the container with
# `docker run -e MCITY_API_TOKEN=...`; the Nginx gateway injects it and the
# agent process never sees it. See plugins/mcity/README.md.
# Observer API base URL rendered into the gateway route (also read by entrypoint.sh).
#mcity_url: "https://midnight.city/observer/"
# Agent id this OmegaClaw instance controls. Empty means observation only.
mcityAgentId: ""
# read = observe only (default). control = take a direct control lease at start.
mcityMode: "read"
# Per request HTTP timeout towards the gateway, seconds.
mcityHttpTimeout: 12
# How long to poll recent events for an action outcome, seconds.
mcityConfirmTimeout: 8
# Hard cap on characters returned by any mcity skill.
mcityMaxResultChars: 900
# Minimum seconds between two world changing actions.
mcityActionMinInterval: 3
# Exact merchant names the agent may trade with. Empty disables the trade skill.
mcityTradeMerchants: ["*"]
# Maximum quantity per trade. Zero disables the trade skill.
mcityTradeMaxQuantity: 100000
